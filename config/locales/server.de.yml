de:
  piratenlogin:
    alert_piratenlogin_not_allowed: "Du kannst die Anwendung im Moment nicht per Piratenlogin nutzen, da dir die erforderliche Rolle 'Piratenpartei Deutschland' fehlt. Nach der Registrierung kann es bis zu einer Stunde dauern, bis dein Account überprüft wurde und du Discourse nutzen kannst."
  site_settings:
    piratenlogin_enabled: Enable Piratenlogin authentication. Customize user interface text <a href='%{base_path}/admin/customize/site_texts?q=js.login.oidc'>here</a>
    piratenlogin_discovery_document: "Piratenlogin discovery document URL. Normally located at 'https://your.domain/.well-known/openid-configuration'"
    piratenlogin_client_id: "Piratenlogin client ID"
    piratenlogin_client_secret: "Piratenlogin client secret"
    piratenlogin_authorize_scope: "The scopes sent to the authorize endpoint. This must include 'openid'."
    piratenlogin_token_scope: "The scopes sent when requesting the token endpoint. The official specification does not require this."
    piratenlogin_error_redirects: "If the callback error_reason contains the first parameter, the user will be redirected to the URL in the second parameter"
    piratenlogin_verbose_logging: "Log detailed openid-connect authentication information to `/logs`. Keep this disabled during normal use."
    piratenlogin_authorize_parameters: "URL parameters which will be included in the redirect from /auth/oidc to the IDP's authorize endpoint"
    piratenlogin_group_sync_enabled: "Die Keycloak-Gruppe des Mitglieds bei jeder Anmeldung auf die zugeordnete Discourse-Gruppe übertragen. Ohne diese Einstellung wird keine Gruppe hinzugefügt oder entfernt."
    piratenlogin_groups_claim: "Claim im Token bzw. in der Userinfo, der die Gliederungsnamen enthält. Der Scope 'user_roles' liefert sie im Claim 'roles'. Fehlt der Claim, bleiben die Gruppen unverändert."
    piratenlogin_group_parent_path: "Nur nötig, wenn der Claim vollständige Gruppenpfade liefert: übergeordnete Keycloak-Gruppe, unterhalb derer die Landesverbände liegen. Nur Pfade darunter werden ausgewertet. Leer lassen, um jeden Wert zu akzeptieren."
    piratenlogin_group_mapping: "Eine Zuordnung pro Zeile, als 'Keycloak-Gruppe|Discourse-Gruppe'. Ohne '|' wird der Name unverändert übernommen. Die Discourse-Gruppe wird über 'name' und 'full_name' gefunden, da ein Gruppenname keine Leerzeichen enthalten darf. Diese Liste ist zugleich die Positivliste: nur die hier genannten Gruppen werden überhaupt verändert, automatische Gruppen nie."
